name: Android Build & Distribute

on:
  push:
    branches: [ main, 'release/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write   # нужно, чтобы бот мог закоммитить новую версию (задание Б)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Получаем код
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 17 (кэш Gradle включён)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 3. Задание Б: version bumping только на ветках release/*
      - name: Bump version (release/* only)
        if: startsWith(github.ref_name, 'release/')
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#release/}"
          sed -i -E "s/versionCode = [0-9]+/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i -E "s/versionName = \"[^\"]*\"/versionName = \"${VERSION_NAME}\"/" app/build.gradle.kts
          grep -nE "versionCode|versionName" app/build.gradle.kts
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "ci: bump version to ${VERSION_NAME} (${{ github.run_number }}) [skip ci]" || echo "nothing to commit"
          git push

      # 4. Юнит-тесты (работают и для pull request)
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # 5. Расшифровка keystore (секреты есть только при push)
      - name: Decode keystore
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      # 6. Релизные сборки: APK (для Firebase) и AAB (задание А, формат для Google Play)
      - name: Assemble Release APK
        if: github.event_name == 'push'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Bundle Release AAB
        if: github.event_name == 'push'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      # 7. Артефакты для скачивания из вкладки Actions
      - name: Upload APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # 8. Fastlane -> Firebase App Distribution
      - name: Set up Ruby
        if: github.event_name == 'push'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Run Fastlane Distribute
        if: github.event_name == 'push'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          bundle install
          bundle exec fastlane distribute
